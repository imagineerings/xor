name: zed-collaboration

services:
  collaboration:
    image: ${COLLABORATION_IMAGE:-zed-collaboration:local}
    command: ["serve", "all"]
    environment:
      COLLABORATION_PUBLIC_URL: ${COLLABORATION_PUBLIC_URL:-http://localhost:8080}
      COLLABORATION_DATABASE_URL: postgres://${POSTGRES_USER:-collaboration}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-collaboration}
      COLLABORATION_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      COLLABORATION_OBJECT_ENDPOINT: http://127.0.0.1:9000
      COLLABORATION_OBJECT_REGION: ${COLLABORATION_OBJECT_REGION:-us-east-1}
      COLLABORATION_OBJECT_BUCKET: ${COLLABORATION_OBJECT_BUCKET:-collaboration}
      COLLABORATION_OBJECT_ACCESS_KEY: ${COLLABORATION_OBJECT_ACCESS_KEY:?set COLLABORATION_OBJECT_ACCESS_KEY}
      COLLABORATION_OBJECT_SECRET_KEY: ${COLLABORATION_OBJECT_SECRET_KEY:?set COLLABORATION_OBJECT_SECRET_KEY}
      COLLABORATION_OBJECT_ADDRESSING_STYLE: path
      COLLABORATION_GIT_REPOSITORY_PATH: /var/lib/collaboration/git
      COLLABORATION_REPLICA_COUNT: "1"
      COLLABORATION_PUSH_ENABLED: "false"
      COLLABORATION_PAIRING_ENABLED: "false"
      COLLABORATION_RELAY_MESH_ENABLED: "false"
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-collaboration}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-collaboration}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-16}
      BLOB_STORE_URL: http://127.0.0.1:9000
      BLOB_STORE_REGION: ${COLLABORATION_OBJECT_REGION:-us-east-1}
      BLOB_STORE_BUCKET: ${COLLABORATION_OBJECT_BUCKET:-collaboration}
      BLOB_STORE_ACCESS_KEY: ${COLLABORATION_OBJECT_ACCESS_KEY:?set COLLABORATION_OBJECT_ACCESS_KEY}
      BLOB_STORE_SECRET_KEY: ${COLLABORATION_OBJECT_SECRET_KEY:?set COLLABORATION_OBJECT_SECRET_KEY}
      ZED_ENVIRONMENT: ${ZED_ENVIRONMENT:-development}
      ZED_CLOUD_INTERNAL_API_KEY: ${ZED_CLOUD_INTERNAL_API_KEY:?set ZED_CLOUD_INTERNAL_API_KEY}
      RUST_LOG: ${RUST_LOG:-collab=info}
      LOG_JSON: ${LOG_JSON:-true}
    volumes:
      - collaboration-git:/var/lib/collaboration/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/collab", "version"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    network_mode: service:object-store

  collaboration-readiness:
    image: curlimages/curl:8.12.1
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "24"
      - --retry-all-errors
      - --retry-delay
      - "5"
      - http://object-store:8080/healthz
    depends_on:
      collaboration:
        condition: service_healthy
    profiles: [validation]
    restart: "no"
    networks: [collaboration]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collaboration}
      POSTGRES_USER: ${POSTGRES_USER:-collaboration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - collaboration-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [collaboration]

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - collaboration-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [collaboration]

  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${COLLABORATION_OBJECT_ACCESS_KEY:?set COLLABORATION_OBJECT_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${COLLABORATION_OBJECT_SECRET_KEY:?set COLLABORATION_OBJECT_SECRET_KEY}
    volumes:
      - collaboration-objects:/data
    ports:
      - "${COLLABORATION_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [collaboration]

  object-store-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      COLLABORATION_OBJECT_ACCESS_KEY: ${COLLABORATION_OBJECT_ACCESS_KEY:?set COLLABORATION_OBJECT_ACCESS_KEY}
      COLLABORATION_OBJECT_SECRET_KEY: ${COLLABORATION_OBJECT_SECRET_KEY:?set COLLABORATION_OBJECT_SECRET_KEY}
      COLLABORATION_OBJECT_BUCKET: ${COLLABORATION_OBJECT_BUCKET:-collaboration}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://object-store:9000 "$${COLLABORATION_OBJECT_ACCESS_KEY}" "$${COLLABORATION_OBJECT_SECRET_KEY}"
        mc mb --ignore-existing "local/$${COLLABORATION_OBJECT_BUCKET}"
        mc anonymous set none "local/$${COLLABORATION_OBJECT_BUCKET}"
      '
    restart: "no"
    networks: [collaboration]

volumes:
  collaboration-postgres:
    labels:
      dev.zed.collaboration.volume: postgres
  collaboration-redis:
    labels:
      dev.zed.collaboration.volume: redis
  collaboration-objects:
    labels:
      dev.zed.collaboration.volume: objects
  collaboration-git:
    labels:
      dev.zed.collaboration.volume: git

networks:
  collaboration:
    driver: bridge
    labels:
      dev.zed.collaboration.network: local
