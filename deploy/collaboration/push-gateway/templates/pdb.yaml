{{- if and .Values.deployment.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "collaborationPush.name" . }}
  labels: {{- include "collaborationPush.runtimeLabels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "collaborationPush.runtimeLabels" . | nindent 6 }}
{{- end }}
