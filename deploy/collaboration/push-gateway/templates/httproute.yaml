{{- if and .Values.deployment.enabled .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "collaborationPush.name" . }}
  labels: {{- include "collaborationPush.runtimeLabels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - { name: {{ include "collaborationPush.name" . }}, port: {{ .Values.service.port }} }
{{- end }}
