{{- if .Values.deployment.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "collaborationPush.name" . }}
  labels: {{- include "collaborationPush.runtimeLabels" . | nindent 4 }}
spec:
  selector: {{- include "collaborationPush.runtimeLabels" . | nindent 4 }}
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: public, protocol: TCP }
{{- end }}
