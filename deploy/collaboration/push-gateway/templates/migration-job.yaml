{{- if and .Values.deployment.enabled .Values.migration.enabled (not .Values.rollback.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "collaborationPush.name" . }}-migrate
  labels: {{- include "collaborationPush.migrationLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {{- include "collaborationPush.migrationLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "collaborationPush.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate-only"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - { name: ZED_PUSH_REQUIRED_SCHEMA_VERSION, value: {{ .Values.migration.requiredSchemaVersion | quote }} }
            - { name: ZED_PUSH_RUNTIME_DATABASE_ROLE, value: {{ .Values.migration.runtimeDatabaseRole | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.migration.secretName }}, key: {{ .Values.migration.databaseUrlKey }} } }
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
