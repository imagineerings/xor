{{- if and .Values.deployment.enabled .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "collaboration.name" . }}
  labels: {{- include "collaboration.runtimeLabels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: { type: Exact, value: / }
        - path: { type: Exact, value: /healthz }
        {{- range list "/rpc" "/extensions" "/telemetry" "/v1" "/media" "/git" "/.well-known" "/info" }}
        - path: { type: PathPrefix, value: {{ . }} }
        {{- end }}
      backendRefs:
        - { name: {{ include "collaboration.name" . }}, port: {{ .Values.service.port }} }
{{- end }}
