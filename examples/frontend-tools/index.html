<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sim Frontend Tools Example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 720px;
      }
      label,
      textarea,
      button {
        display: block;
        width: 100%;
      }
      textarea {
        min-height: 10rem;
        margin: 0.5rem 0 1rem;
      }
      output {
        display: block;
        margin-top: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Frontend Tools Example</h1>
    <label for="input">Text</label>
    <textarea id="input">Summarize this text with a frontend tool.</textarea>
    <button id="run">Run summarize_text</button>
    <output id="output"></output>
    <script type="module" src="./tool-client.js"></script>
  </body>
</html>
