# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`.
name: release
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  push:
    tags:
    - rust-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing rust-v* tag to publish when the workflow is run manually
        required: true
        type: string
permissions:
  contents: read
jobs:
  product_builds:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
        - product: rust
          platform: linux
          runner: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          artifact: rust-linux-x86_64
          artifact_path: target/products/rust/release/rust-*-linux-x86_64.tar.gz
        - product: rust
          platform: macos
          runner: macos-15
          target: aarch64-apple-darwin
          artifact: rust-macos-aarch64
          artifact_path: target/products/rust/release/rust-*-macos-aarch64.dmg
        - product: rust
          platform: windows
          runner: windows-2022
          target: x86_64-pc-windows-msvc
          artifact: rust-windows-x86_64
          artifact_path: target/products/rust/release/rust-*-windows-x86_64.exe
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
    - name: steps::enable_windows_long_paths
      if: matrix.platform == 'windows'
      run: git config --global core.longpaths true
      shell: pwsh
    - name: release::product_builds
      run: |
        if [[ "$TAG" != rust-v* ]]; then
            echo "Release tag must start with rust-v: $TAG" >&2
            exit 1
        fi
        echo "RELEASE_VERSION=${TAG#rust-v}" >> "$GITHUB_ENV"
      env:
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    - name: release::product_builds
      if: matrix.platform == 'linux'
      run: ./script/linux && ./script/download-wasi-sdk
    - name: release::product_builds
      if: matrix.platform == 'linux'
      run: cargo xtask bundle --product "$PRODUCT_ID" --platform "$PLATFORM" --target "$TARGET"
      env:
        PRODUCT_ID: ${{ matrix.product }}
        PLATFORM: ${{ matrix.platform }}
        TARGET: ${{ matrix.target }}
        CC: clang
        CXX: clang++
    - name: release::product_builds
      if: matrix.platform == 'macos'
      run: cargo xtask bundle --product "$PRODUCT_ID" --platform macos --target "$TARGET"
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    - name: release::product_builds
      if: matrix.platform == 'windows'
      run: cargo xtask bundle --product $env:PRODUCT_ID --platform windows --target $env:TARGET
      shell: pwsh
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }}
        CERT_PROFILE_NAME: ${{ secrets.CERT_PROFILE_NAME }}
        ENDPOINT: ${{ secrets.ENDPOINT }}
        FILE_DIGEST: ${{ secrets.FILE_DIGEST }}
        TIMESTAMP_DIGEST: ${{ secrets.TIMESTAMP_DIGEST }}
        TIMESTAMP_SERVER: ${{ secrets.TIMESTAMP_SERVER }}
    - name: release::product_builds
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
    timeout-minutes: 120
  publish_product:
    needs:
    - product_builds
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: release::publish_product
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: release-artifacts
    - name: release::publish_product
      run: |
        if [[ "$TAG" != rust-v* ]]; then
            echo "Release tag must start with rust-v: $TAG" >&2
            exit 1
        fi

        mapfile -t FILES < <(find release-artifacts -type f)
        if [[ ${#FILES[@]} -ne 3 ]]; then
            echo "Expected exactly three Rust product artifacts, found ${#FILES[@]}" >&2
            exit 1
        fi
        PATTERNS=(
            'rust-*-linux-x86_64.tar.gz'
            'rust-*-macos-aarch64.dmg'
            'rust-*-windows-x86_64.exe'
        )
        for PATTERN in "${PATTERNS[@]}"; do
            mapfile -t MATCHES < <(find release-artifacts -type f -name "$PATTERN")
            if [[ ${#MATCHES[@]} -ne 1 ]]; then
                echo "Expected exactly one artifact matching $PATTERN, found ${#MATCHES[@]}" >&2
                exit 1
            fi
        done
        TITLE="Copper ${TAG#rust-}"
        if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE"
            gh release upload "$TAG" "${FILES[@]}" --clobber
        else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --generate-notes --verify-tag
        fi
      env:
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
