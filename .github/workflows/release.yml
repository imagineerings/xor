      shell: pwsh
    timeout-minutes: 120
  product_builds:
    needs:
    - prepare_release
    - release_licenses
    - application_builds
    - remote_server_builds
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
      SCCACHE_GHA_ENABLED: on
      SCCACHE_IDLE_TIMEOUT: '0'
      RUSTC_WRAPPER: sccache
      CARGO_TARGET_DIR: target/products/${{ matrix.product }}
      ZED_PRODUCT_ID: ${{ matrix.product }}
      ZED_PRODUCT_DISPLAY_NAME: ${{ matrix.display_name }}
      ZED_PRODUCT_EXECUTABLE: ${{ matrix.executable_name }}
      ZED_PRODUCT_BUNDLE_ID: ${{ matrix.bundle_identifier }}
      ZED_PRODUCT_URL_SCHEME: ${{ matrix.url_scheme }}
      ZED_PRODUCT_ICON_SET: ${{ matrix.icon_set }}
      ZED_PRODUCT_DATA_NAMESPACE: ${{ matrix.data_namespace }}
      ZED_PRODUCT_UPDATE_NAMESPACE: ${{ matrix.update_namespace }}
      ZED_PRODUCT_WINDOWS_INSTALLER_ID: ${{ matrix.windows_installer_id }}
      ZED_PRODUCT_APP_FEATURES: ${{ matrix.application_features }}
      ZED_PRODUCT_REMOTE_FEATURES: ${{ matrix.remote_features }}
      ZED_RELEASE_CHANNEL: stable
    strategy:
      matrix:
        include:
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: linux
          runner: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          remote_target: x86_64-unknown-linux-musl
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-linux-x86_64
          remote_artifact: rust-remote-server-linux-x86_64
          artifact: rust-linux-x86_64
          artifact_suffix: linux-x86_64.tar.gz
          artifact_path: target/products/rust/release/rust-*-linux-x86_64.tar.gz
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: macos
          runner: macos-15
          target: aarch64-apple-darwin
          remote_target: aarch64-apple-darwin
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-macos-aarch64
          remote_artifact: rust-remote-server-macos-aarch64
          artifact: rust-macos-aarch64
          artifact_suffix: macos-aarch64.dmg
          artifact_path: target/products/rust/release/rust-*-macos-aarch64.dmg
        - product: rust
          display_name: Copper
          executable_name: copper
          bundle_identifier: dev.ideflavors.rust
          url_scheme: ide-rust
          icon_set: assets/product_flavors/rust
          data_namespace: ide-rust
          update_namespace: rust
          windows_installer_id: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
          platform: windows
          runner: windows-2022
          target: x86_64-pc-windows-msvc
          remote_target: x86_64-pc-windows-msvc
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
          application_artifact: rust-application-windows-x86_64
          remote_artifact: rust-remote-server-windows-x86_64
          artifact: rust-windows-x86_64
          artifact_suffix: windows-x86_64.exe
          artifact_path: target/products/rust/release/rust-*-windows-x86_64.exe
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::product_builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-licenses
        path: release-licenses
    - name: release::product_builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.application_artifact }}
        path: release-application
    - name: release::product_builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.remote_artifact }}
        path: release-remote-server
    - name: release::verify_release_licenses
      run: |
        sha256_file() {
            if [[ "$RUNNER_OS" == "macOS" ]]; then
                shasum -a 256 "$1" | awk '{print $1}'
            else
                sha256sum "$1" | awk '{print $1}'
            fi
        }
        test -s release-licenses/licenses.md
        test -s release-licenses/metadata.json
        CARGO_LOCK_HASH="$(sha256_file Cargo.lock)"
        LICENSES_HASH="$(sha256_file release-licenses/licenses.md)"
        jq -e \
            --arg commit_sha "$COMMIT_SHA" \
            --arg cargo_lock_hash "$CARGO_LOCK_HASH" \
            --arg licenses_hash "$LICENSES_HASH" \
            '.commit_sha == $commit_sha and .cargo_lock_hash == $cargo_lock_hash and .licenses_hash == $licenses_hash' \
            release-licenses/metadata.json >/dev/null
        cp release-licenses/licenses.md assets/licenses.md
      env:
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::product_builds
      if: matrix.platform != 'windows'
      run: |
        jq -e --arg commit_sha "$COMMIT_SHA" --arg target "$TARGET" --arg features "$APPLICATION_FEATURES" \
            '.commit_sha == $commit_sha and .target == $target and .features == $features' \
            release-application/metadata.json >/dev/null
        jq -e --arg commit_sha "$COMMIT_SHA" --arg target "$REMOTE_TARGET" --arg features "$REMOTE_FEATURES" \
            '.commit_sha == $commit_sha and .target == $target and .features == $features' \
            release-remote-server/metadata.json >/dev/null
        APPLICATION_DEST="target/products/${PRODUCT_ID}/${TARGET}/release"
        REMOTE_DEST="target/products/${PRODUCT_ID}/${REMOTE_TARGET}/release"
        mkdir -p "$APPLICATION_DEST" "$REMOTE_DEST"
        cp release-application/zed release-application/cli "$APPLICATION_DEST/"
        cp release-remote-server/remote_server "$REMOTE_DEST/"
        chmod +x "$APPLICATION_DEST/zed" "$APPLICATION_DEST/cli" "$REMOTE_DEST/remote_server"
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        REMOTE_TARGET: ${{ matrix.remote_target }}
        APPLICATION_FEATURES: ${{ matrix.application_features }}
        REMOTE_FEATURES: ${{ matrix.remote_features }}
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::product_builds
      if: matrix.platform == 'windows'
      run: |
        $applicationMetadata = Get-Content release-application/metadata.json | ConvertFrom-Json
        $remoteMetadata = Get-Content release-remote-server/metadata.json | ConvertFrom-Json
        if ($applicationMetadata.commit_sha -ne $env:COMMIT_SHA -or $applicationMetadata.target -ne $env:TARGET -or $applicationMetadata.features -ne $env:APPLICATION_FEATURES) {
            throw "Application artifact metadata does not match the release plan"
        }
        if ($remoteMetadata.commit_sha -ne $env:COMMIT_SHA -or $remoteMetadata.target -ne $env:REMOTE_TARGET -or $remoteMetadata.features -ne $env:REMOTE_FEATURES) {
            throw "Remote-server artifact metadata does not match the release plan"
        }
        $applicationDest = "target/products/$env:PRODUCT_ID/$env:TARGET/release"
        $remoteDest = "target/products/$env:PRODUCT_ID/$env:REMOTE_TARGET/release"
        New-Item -ItemType Directory -Path $applicationDest, $remoteDest -Force | Out-Null
        Copy-Item release-application/zed.exe, release-application/cli.exe, release-application/auto_update_helper.exe, release-application/zed.pdb, release-application/cli.pdb, release-application/auto_update_helper.pdb -Destination $applicationDest
        Copy-Item release-remote-server/remote_server.exe, release-remote-server/remote_server.pdb -Destination $remoteDest
      shell: pwsh
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        REMOTE_TARGET: ${{ matrix.remote_target }}
        APPLICATION_FEATURES: ${{ matrix.application_features }}
        REMOTE_FEATURES: ${{ matrix.remote_features }}
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::configure_release_cache_namespace
      run: |
        TOOLCHAIN_HASH="$(git hash-object rust-toolchain.toml)"
        echo "SCCACHE_GHA_VERSION=release-v2-${RUNNER_OS}-${CACHE_TARGET}-${TOOLCHAIN_HASH}" >> "$GITHUB_ENV"
      env:
        CACHE_TARGET: ${{ matrix.target }}
    - name: steps::setup_release_sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0
        disable_annotations: 'true'
    - name: release::product_builds
      if: matrix.platform == 'macos'
      run: uname -m && rustc -vV && df -h . && xcode-select -p
    - name: steps::enable_windows_long_paths
      if: matrix.platform == 'windows'
      run: git config --global core.longpaths true
      shell: pwsh
    - name: release::product_builds
      if: matrix.platform == 'linux'
      run: ./script/linux && ./script/download-wasi-sdk
    - name: release::product_builds
      if: matrix.platform == 'linux'
      run: |
        export ZED_PRODUCT_ARTIFACT_NAME="${ZED_PRODUCT_ID}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
        export ZED_BUNDLE_PHASE=package
        script/bundle-linux
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        CC: clang
        CXX: clang++
    - name: release::product_builds
      if: matrix.platform == 'macos'
      run: |
        export ZED_PRODUCT_ARTIFACT_NAME="${ZED_PRODUCT_ID}-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
        export ZED_BUNDLE_PHASE=package
        script/bundle-mac "$TARGET"
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        TARGET: ${{ matrix.target }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    - name: release::product_builds
      if: matrix.platform == 'windows'
      run: |
        $env:ZED_PRODUCT_ARTIFACT_NAME = "$env:ZED_PRODUCT_ID-$env:RELEASE_VERSION-$env:ARTIFACT_SUFFIX"
        $env:ZED_BUNDLE_PHASE = "package"
        script/bundle-windows.ps1 -Architecture x86_64
      shell: pwsh
      env:
        ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }}
        CERT_PROFILE_NAME: ${{ secrets.CERT_PROFILE_NAME }}
        ENDPOINT: ${{ secrets.ENDPOINT }}
        FILE_DIGEST: ${{ secrets.FILE_DIGEST }}
        TIMESTAMP_DIGEST: ${{ secrets.TIMESTAMP_DIGEST }}
        TIMESTAMP_SERVER: ${{ secrets.TIMESTAMP_SERVER }}
    - name: release::product_builds
      if: matrix.platform != 'windows'
      run: python3 script/smoke-product-bundle --product "$PRODUCT_ID" --platform "$PLATFORM" --target "$TARGET"
      env:
        PRODUCT_ID: ${{ matrix.product }}
        PLATFORM: ${{ matrix.platform }}
        TARGET: ${{ matrix.target }}
    - name: release::product_builds
      if: matrix.platform == 'windows'
      run: python script/smoke-product-bundle --product $env:PRODUCT_ID --platform windows --target $env:TARGET
      shell: pwsh
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
    - name: release::product_builds
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
    - name: steps::finalize_release_sccache
      if: always() && matrix.platform != 'windows'
      run: |
        STATS="$(sccache --show-stats)"
        printf '%s\n' "$STATS"
        {
            printf '### sccache: %s / %s\n\n```text\n' "$RUNNER_OS" "$SCCACHE_GHA_VERSION"
            printf '%s\n' "$STATS"
            printf '```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        sccache --stop-server
    - name: steps::finalize_release_sccache
      if: always() && matrix.platform == 'windows'
      run: |
        $stats = (& sccache --show-stats | Out-String)
        if ($LASTEXITCODE -ne 0) {
            throw "sccache --show-stats failed with exit code $LASTEXITCODE"
        }
        Write-Host $stats
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('### sccache: {0} / {1}' -f $env:RUNNER_OS, $env:SCCACHE_GHA_VERSION)
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $stats
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
        & sccache --stop-server
        if ($LASTEXITCODE -ne 0) {
            throw "sccache --stop-server failed with exit code $LASTEXITCODE"
        }
      shell: pwsh
    - name: release::product_builds
      if: always() && matrix.platform == 'macos'
      run: df -h . && du -sh target
    timeout-minutes: 90
  publish_product:
    needs:
    - prepare_release
    - product_builds
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        fetch-tags: true
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::publish_product
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rust-linux-x86_64
        path: release-artifacts
    - name: release::publish_product
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rust-macos-aarch64
        path: release-artifacts
    - name: release::publish_product
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rust-windows-x86_64
        path: release-artifacts
    - name: release::publish_product
      run: |
        git fetch --force origin main --tags

        ARGS=(release-version --commit "$COMMIT_SHA" --bump "$BUMP")
        if [[ -n "$EXPLICIT_VERSION" ]]; then
            ARGS+=(--explicit-version "$EXPLICIT_VERSION")
        fi
        if [[ -n "$EXISTING_TAG" ]]; then
            ARGS+=(--existing-tag "$EXISTING_TAG")
        fi
        DECISION="$(cargo xtask "${ARGS[@]}")"
        ACTUAL_COMMIT="$(jq -r '.commit_sha' <<<"$DECISION")"
        ACTUAL_VERSION="$(jq -r '.version' <<<"$DECISION")"
        ACTUAL_TAG="$(jq -r '.tag' <<<"$DECISION")"
        if [[ "$ACTUAL_COMMIT" != "$COMMIT_SHA" || "$ACTUAL_VERSION" != "$VERSION" || "$ACTUAL_TAG" != "$TAG" ]]; then
            echo "Release state changed while artifacts were building; refusing stale publication" >&2
            exit 1
        fi

        mapfile -t FILES < <(find release-artifacts -type f -print | sort)
        if [[ ${#FILES[@]} -ne 3 ]]; then
            echo "Expected exactly 3 Copper artifacts, found ${#FILES[@]}" >&2
            exit 1
        fi
        PATTERNS=(
            'rust-*-linux-x86_64.tar.gz'
            'rust-*-macos-aarch64.dmg'
            'rust-*-windows-x86_64.exe'
        )
        for PATTERN in "${PATTERNS[@]}"; do
            mapfile -t MATCHES < <(find release-artifacts -type f -name "$PATTERN")
            if [[ ${#MATCHES[@]} -ne 1 ]]; then
                echo "Expected exactly one artifact matching $PATTERN, found ${#MATCHES[@]}" >&2
                exit 1
            fi
        done
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$COMMIT_SHA" ]]; then
                echo "Existing tag $TAG points to $TAG_COMMIT, not $COMMIT_SHA" >&2
                exit 1
            fi
        else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT_SHA" -m "Copper $VERSION"
            git push origin "refs/tags/$TAG"
        fi

        TITLE="Copper $VERSION"
        if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TITLE" --generate-notes --verify-tag
        fi

        mapfile -t REMOTE_NAMES < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
        for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            if ! printf '%s\n' "${REMOTE_NAMES[@]}" | grep -Fxq "$NAME"; then
                gh release upload "$TAG" "$FILE"
            fi
        done

        mapfile -t EXPECTED_NAMES < <(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | sort)
        mapfile -t REMOTE_NAMES < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
        if ! diff -u <(printf '%s\n' "${EXPECTED_NAMES[@]}") <(printf '%s\n' "${REMOTE_NAMES[@]}") ; then
            echo "GitHub Release assets do not exactly match the validated Copper artifacts" >&2
            exit 1
        fi
        gh release edit "$TAG" --title "$TITLE" --draft=false
      env:
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
        VERSION: ${{ needs.prepare_release.outputs.version }}
        TAG: ${{ needs.prepare_release.outputs.tag }}
        BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        EXPLICIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        EXISTING_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
concurrency:
  group: copper-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euxo pipefail {0}
