# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`.
name: release
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  push:
    tags:
    - rust-v*
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component for a manual release: patch, minor, or major'
        type: string
        default: patch
      version:
        description: Optional exact X.Y.Z version for manual recovery
        type: string
        default: ''
      commit_sha:
        description: Optional commit SHA on main; defaults to the selected main commit
        type: string
        default: ''
  workflow_run:
    types:
    - completed
    workflows:
    - run_tests
    branches:
    - main
permissions:
  contents: read
jobs:
  prepare_release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        fetch-tags: true
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
    - id: resolve-release
      name: release::prepare_release
      run: |
        git fetch --force origin main --tags

        ARGS=(release-version --commit "$COMMIT_SHA" --bump "$BUMP")
        if [[ -n "$EXPLICIT_VERSION" ]]; then
            ARGS+=(--explicit-version "$EXPLICIT_VERSION")
        fi
        if [[ -n "$EXISTING_TAG" ]]; then
            ARGS+=(--existing-tag "$EXISTING_TAG")
        fi
        DECISION="$(cargo xtask "${ARGS[@]}")"
        jq -e '.commit_sha and .version and .tag' <<<"$DECISION" >/dev/null
        {
            echo "commit_sha=$(jq -r '.commit_sha' <<<"$DECISION")"
            echo "version=$(jq -r '.version' <<<"$DECISION")"
            echo "tag=$(jq -r '.tag' <<<"$DECISION")"
        } >> "$GITHUB_OUTPUT"
      env:
        COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
        BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        EXPLICIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        EXISTING_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    outputs:
      commit_sha: ${{ steps.resolve-release.outputs.commit_sha }}
      version: ${{ steps.resolve-release.outputs.version }}
      tag: ${{ steps.resolve-release.outputs.tag }}
    timeout-minutes: 15
  product_builds:
    needs:
    - prepare_release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
    strategy:
      matrix:
        include:
        - product: rust
          platform: linux
          runner: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          artifact: rust-linux-x86_64
          artifact_path: target/products/rust/release/rust-*-linux-x86_64.tar.gz
        - product: rust
          platform: macos
          runner: macos-15
          target: aarch64-apple-darwin
          artifact: rust-macos-aarch64
          artifact_path: target/products/rust/release/rust-*-macos-aarch64.dmg
        - product: rust
          platform: windows
          runner: windows-2022
          target: x86_64-pc-windows-msvc
          artifact: rust-windows-x86_64
          artifact_path: target/products/rust/release/rust-*-windows-x86_64.exe
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::product_builds
      if: matrix.platform == 'linux'
      run: ./script/linux && ./script/download-wasi-sdk
    - name: release::product_builds
      if: matrix.platform == 'linux'
      run: cargo xtask bundle --product "$PRODUCT_ID" --platform "$PLATFORM" --target "$TARGET"
      env:
        PRODUCT_ID: ${{ matrix.product }}
        PLATFORM: ${{ matrix.platform }}
        TARGET: ${{ matrix.target }}
    - name: release::product_builds
      if: matrix.platform == 'macos'
      run: cargo xtask bundle --product "$PRODUCT_ID" --platform macos --target "$TARGET"
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    - name: release::product_builds
      if: matrix.platform == 'windows'
      run: cargo xtask bundle --product $env:PRODUCT_ID --platform windows --target $env:TARGET
      shell: pwsh
      env:
        PRODUCT_ID: ${{ matrix.product }}
        TARGET: ${{ matrix.target }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }}
        CERT_PROFILE_NAME: ${{ secrets.CERT_PROFILE_NAME }}
        ENDPOINT: ${{ secrets.ENDPOINT }}
        FILE_DIGEST: ${{ secrets.FILE_DIGEST }}
        TIMESTAMP_DIGEST: ${{ secrets.TIMESTAMP_DIGEST }}
        TIMESTAMP_SERVER: ${{ secrets.TIMESTAMP_SERVER }}
    - name: release::product_builds
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
    timeout-minutes: 120
  publish_product:
    needs:
    - prepare_release
    - product_builds
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        fetch-tags: true
        ref: ${{ needs.prepare_release.outputs.commit_sha }}
    - name: release::publish_product
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: release-artifacts
    - name: release::publish_product
      run: |
        git fetch --force origin main --tags

        ARGS=(release-version --commit "$COMMIT_SHA" --bump "$BUMP")
        if [[ -n "$EXPLICIT_VERSION" ]]; then
            ARGS+=(--explicit-version "$EXPLICIT_VERSION")
        fi
        if [[ -n "$EXISTING_TAG" ]]; then
            ARGS+=(--existing-tag "$EXISTING_TAG")
        fi
        DECISION="$(cargo xtask "${ARGS[@]}")"
        ACTUAL_COMMIT="$(jq -r '.commit_sha' <<<"$DECISION")"
        ACTUAL_VERSION="$(jq -r '.version' <<<"$DECISION")"
        ACTUAL_TAG="$(jq -r '.tag' <<<"$DECISION")"
        if [[ "$ACTUAL_COMMIT" != "$COMMIT_SHA" || "$ACTUAL_VERSION" != "$VERSION" || "$ACTUAL_TAG" != "$TAG" ]]; then
            echo "Release state changed while artifacts were building; refusing stale publication" >&2
            exit 1
        fi

        mapfile -t FILES < <(find release-artifacts -type f -print | sort)
        if [[ ${#FILES[@]} -ne 3 ]]; then
            echo "Expected exactly 3 Copper artifacts, found ${#FILES[@]}" >&2
            exit 1
        fi
        PATTERNS=(
            'rust-*-linux-x86_64.tar.gz'
            'rust-*-macos-aarch64.dmg'
            'rust-*-windows-x86_64.exe'
        )
        for PATTERN in "${PATTERNS[@]}"; do
            mapfile -t MATCHES < <(find release-artifacts -type f -name "$PATTERN")
            if [[ ${#MATCHES[@]} -ne 1 ]]; then
                echo "Expected exactly one artifact matching $PATTERN, found ${#MATCHES[@]}" >&2
                exit 1
            fi
        done
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$COMMIT_SHA" ]]; then
                echo "Existing tag $TAG points to $TAG_COMMIT, not $COMMIT_SHA" >&2
                exit 1
            fi
        else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT_SHA" -m "Copper $VERSION"
            git push origin "refs/tags/$TAG"
        fi

        TITLE="Copper $VERSION"
        if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TITLE" --generate-notes --verify-tag
        fi

        mapfile -t REMOTE_NAMES < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
        for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            if ! printf '%s\n' "${REMOTE_NAMES[@]}" | grep -Fxq "$NAME"; then
                gh release upload "$TAG" "$FILE"
            fi
        done

        mapfile -t EXPECTED_NAMES < <(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | sort)
        mapfile -t REMOTE_NAMES < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
        if ! diff -u <(printf '%s\n' "${EXPECTED_NAMES[@]}") <(printf '%s\n' "${REMOTE_NAMES[@]}") ; then
            echo "GitHub Release assets do not exactly match the validated Copper artifacts" >&2
            exit 1
        fi
        gh release edit "$TAG" --title "$TITLE" --draft=false
      env:
        COMMIT_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
        VERSION: ${{ needs.prepare_release.outputs.version }}
        TAG: ${{ needs.prepare_release.outputs.tag }}
        BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        EXPLICIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        EXISTING_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
concurrency:
  group: copper-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euxo pipefail {0}
