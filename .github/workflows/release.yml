# Minimal Release: build, test, bundle, publish to GitHub Releases on tag push
name: release
on:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

  test_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

  bundle_linux:
    runs-on: ubuntu-latest
    env:
      RUNNER_ARCH: ${{ runner.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --workspace --release
      - name: Create linux tarball
        run: |
          cd target/release
          tar czf ../../sim-linux-${RUNNER_ARCH}.tar.gz sim sim-remote-server
      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-linux-${{ runner.arch }}.tar.gz
          path: sim-linux-${{ env.RUNNER_ARCH }}.tar.gz

  bundle_macos:
    runs-on: macos-latest
    env:
      RUNNER_ARCH: ${{ runner.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --workspace --release
      - name: Create macOS tarball
        run: |
          cd target/release
          tar czf ../../sim-macos-${RUNNER_ARCH}.tar.gz sim sim-remote-server
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-macos-${{ runner.arch }}.tar.gz
          path: sim-macos-${{ env.RUNNER_ARCH }}.tar.gz

  bundle_windows:
    runs-on: windows-latest
    env:
      RUNNER_ARCH: ${{ runner.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --workspace --release
      - name: Create Windows zip
        shell: pwsh
        run: |
          $arch = $env:RUNNER_ARCH
          Compress-Archive -Path target/release/sim.exe, target/release/sim-remote-server.exe -DestinationPath sim-windows-$arch.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-windows-${{ runner.arch }}.zip
          path: sim-windows-${{ env.RUNNER_ARCH }}.zip

  create_release:
    needs:
      - test_linux
      - test_macos
      - test_windows
      - bundle_linux
      - bundle_macos
      - bundle_windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all tests passed
        run: |
          EXIT_CODE=0
          check_result() {
            echo "* $1: $2"
            if [[ "$2" != "skipped" && "$2" != "success" ]]; then EXIT_CODE=1; fi
          }
          check_result "test_linux" "$RESULT_TEST_LINUX"
          check_result "test_macos" "$RESULT_TEST_MACOS"
          check_result "test_windows" "$RESULT_TEST_WINDOWS"
          exit $EXIT_CODE
        env:
          RESULT_TEST_LINUX: ${{ needs.test_linux.result }}
          RESULT_TEST_MACOS: ${{ needs.test_macos.result }}
          RESULT_TEST_WINDOWS: ${{ needs.test_windows.result }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/sim-linux-x86_64.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/sim-linux-aarch64.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/sim-macos-x86_64.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/sim-macos-aarch64.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/sim-windows-x86_64.zip release-assets/ 2>/dev/null || true
          cp artifacts/sim-windows-aarch64.zip release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-pre') }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
