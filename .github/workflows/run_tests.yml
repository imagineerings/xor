# Minimal CI: build, test, lint on PR/push/merge_group
name: run_tests
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  merge_group: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check_style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check for typos
        uses: crate-ci/typos@v1
        with:
          config: ./typos.toml

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  test_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
        total_shards: [6]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker system prune -af
          fi
          df -h
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ matrix.total_shards }}
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 |
            jq -r --argjson shard "$SHARD" --argjson total_shards "$TOTAL_SHARDS" '.packages | to_entries[] | select((.key % $total_shards) == $shard) | .value.name' |
            while read -r package; do
              echo "::group::cargo nextest run -p ${package}"
              cargo nextest run -p "${package}" --no-fail-fast --no-tests pass
              echo "::endgroup::"
            done

  test_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

  test_windows:
    runs-on: windows-latest
    env:
      # Use a short CARGO_HOME so deeply-nested git checkouts (e.g. the `pet`
      # crate's conda test fixtures) stay under Windows' MAX_PATH limit.
      CARGO_HOME: C:\\ch
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: -C link-arg=/PDB:NONE
    steps:
      - uses: actions/checkout@v4
      - name: Enable Windows long paths
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

  check_wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - name: Check WASM
        run: cargo check --target wasm32-unknown-unknown -p gpui_platform
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals
          RUSTC_BOOTSTRAP: 1

  check_dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check unused dependencies
        run: |
          cargo install cargo-machete
          cargo machete
      - name: Check Cargo.lock
        run: cargo update --locked --workspace

  doctests:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker system prune -af
          fi
          df -h
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
      - name: Run doctests
        run: cargo test --workspace --doc

  build_workspace_binaries:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker system prune -af
          fi
          df -h
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all binaries
        run: cargo build --workspace --bins --examples

  tests_pass:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - check_style
      - clippy
      - test_linux
      - test_macos
      - test_windows
      - check_wasm
      - check_dependencies
      - doctests
      - build_workspace_binaries
    steps:
      - name: Check all jobs passed
        run: |
          EXIT_CODE=0
          check_result() {
            echo "* $1: $2"
            if [[ "$2" != "skipped" && "$2" != "success" ]]; then EXIT_CODE=1; fi
          }
          check_result "check_style" "$RESULT_CHECK_STYLE"
          check_result "clippy" "$RESULT_CLIPPY"
          check_result "test_linux" "$RESULT_TEST_LINUX"
          check_result "test_macos" "$RESULT_TEST_MACOS"
          check_result "test_windows" "$RESULT_TEST_WINDOWS"
          check_result "check_wasm" "$RESULT_CHECK_WASM"
          check_result "check_dependencies" "$RESULT_CHECK_DEPENDENCIES"
          check_result "doctests" "$RESULT_DOCTESTS"
          check_result "build_workspace_binaries" "$RESULT_BUILD_WORKSPACE_BINARIES"
          exit $EXIT_CODE
        env:
          RESULT_CHECK_STYLE: ${{ needs.check_style.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST_LINUX: ${{ needs.test_linux.result }}
          RESULT_TEST_MACOS: ${{ needs.test_macos.result }}
          RESULT_TEST_WINDOWS: ${{ needs.test_windows.result }}
          RESULT_CHECK_WASM: ${{ needs.check_wasm.result }}
          RESULT_CHECK_DEPENDENCIES: ${{ needs.check_dependencies.result }}
          RESULT_DOCTESTS: ${{ needs.doctests.result }}
          RESULT_BUILD_WORKSPACE_BINARIES: ${{ needs.build_workspace_binaries.result }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true
