# Generated from xtask::workflows::run_tests
# Rebuild with `cargo xtask workflows`.
name: run_tests
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
on:
  pull_request:
    branches:
    - '**'
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  shared_clippy:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::cargo_fmt
      run: cargo fmt --all -- --check
    - name: run_tests::shared_clippy
      run: ./script/clippy
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 60
  copper_tests:
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      ZED_PRODUCT_ID: rust
      ZED_PRODUCT_UPDATE_BASE_URL: http://test.example
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::free_linux_disk_space
      run: |
        sudo swapoff -a
        sudo rm -rf -- \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/share/chromium
        sudo rm -f -- /mnt/swapfile
        df -h /
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::cargo_install_nextest
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
      with:
        tool: nextest
    - name: run_tests::copper_tests
      run: cargo nextest run --no-fail-fast --no-tests=warn --no-default-features --features zed/agentic-tools,zed/rust-tools,remote_server/rust-tools -p agent -p agent_ui -p auto_update -p call -p cargo_ui -p channel -p client -p collab_ui -p editor -p extension_host -p git -p git_ui -p language_model -p language_models -p languages -p project -p remote_server -p settings -p settings_content -p task -p tasks_ui -p terminal -p terminal_view -p worktree -p workspace -p zed
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 90
  project_benchmarks:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    strategy:
      matrix:
        include:
        - benchmark: cargo_workspace
        - benchmark: structured_execution
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: run_tests::project_benchmarks
      if: matrix.benchmark == 'cargo_workspace'
      run: cargo bench -p project --features cargo-workspace --bench cargo_workspace -- --noplot
    - name: run_tests::project_benchmarks
      if: matrix.benchmark == 'structured_execution'
      run: cargo bench -p project --features structured-execution --bench structured_execution -- --noplot
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 75
  rust_tools_validation:
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: run_tests::rust_tools_validation
      run: cargo fetch --locked
    - name: run_tests::rust_tools_validation
      run: ./script/test-rust-tools-environments --matrix --offline
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 45
  release_automation_validation:
    runs-on: ubuntu-22.04
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: run_tests::release_automation_validation
      run: |
        cargo test -p xtask
        cargo xtask workflows
        git diff --exit-code
        cargo xtask check-workflows
        cargo xtask products --check
        cargo xtask bundle --product rust \
          --platform linux \
          --target x86_64-unknown-linux-gnu \
          --dry-run
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 30
  shared_validation:
    needs:
    - shared_clippy
    - copper_tests
    - project_benchmarks
    - rust_tools_validation
    - release_automation_validation
    - windows_updater_tests
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
    - name: run_tests::shared_validation
      run: |
        exit_code=0
        if [[ "${SHARED_CLIPPY_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${COPPER_TESTS_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${PROJECT_BENCHMARKS_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${RUST_TOOLS_VALIDATION_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${RELEASE_AUTOMATION_VALIDATION_RESULT}" != "success" ]]; then exit_code=1; fi
        if [[ "${WINDOWS_UPDATER_TESTS_RESULT}" != "success" ]]; then exit_code=1; fi
        exit "$exit_code"
      env:
        SHARED_CLIPPY_RESULT: ${{ needs.shared_clippy.result }}
        COPPER_TESTS_RESULT: ${{ needs.copper_tests.result }}
        PROJECT_BENCHMARKS_RESULT: ${{ needs.project_benchmarks.result }}
        RUST_TOOLS_VALIDATION_RESULT: ${{ needs.rust_tools_validation.result }}
        RELEASE_AUTOMATION_VALIDATION_RESULT: ${{ needs.release_automation_validation.result }}
        WINDOWS_UPDATER_TESTS_RESULT: ${{ needs.windows_updater_tests.result }}
    timeout-minutes: 5
  windows_updater_tests:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: 1.2.3
      ZED_PRODUCT_DISPLAY_NAME: Copper
      ZED_PRODUCT_WINDOWS_INSTALLER_ID: '{6D7C1287-4A0E-5F5F-BE2C-8066A31F8761}'
      ZED_PRODUCT_ICON_SET: ${{ github.workspace }}/assets/product_flavors/rust
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::enable_windows_long_paths
      run: git config --global core.longpaths true
      shell: pwsh
    - name: run_tests::windows_updater_tests
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        cargo test --locked -p auto_update_helper -p xtask
        cargo build --locked -p auto_update_helper
        $metadata = (Get-Item target/debug/auto_update_helper.exe).VersionInfo
        if ($metadata.ProductName -ne $env:ZED_PRODUCT_DISPLAY_NAME -or $metadata.FileVersion -ne $env:RELEASE_VERSION) {
            throw "Updater product metadata does not match the resolved release environment"
        }

        $innoSetupPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        $installerResourceLines = @(
            Get-Content crates/zed/resources/windows/zed.iss |
                Where-Object { $_ -match '^(AppId|SetupIconFile)=' }
        )
        if ($installerResourceLines.Count -ne 2) {
            throw "Expected the AppId and SetupIconFile directives in the Windows installer template"
        }
        $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'inno-installer-resource-validation'
        New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null
        $fixturePath = Join-Path $fixtureDirectory 'installer-resources.iss'
        $productIconPath = Join-Path $env:ZED_PRODUCT_ICON_SET 'app-icon.ico'
        @(
            '[Setup]'
            $installerResourceLines
            'AppName=Installer Identity Validation'
            'AppVersion=1.0.0'
            'DefaultDirName={tmp}\InstallerIdentityValidation'
            'Uninstallable=no'
        ) | Set-Content -Path $fixturePath -Encoding utf8
        & $innoSetupPath '/O-' "/DAppId=$env:ZED_PRODUCT_WINDOWS_INSTALLER_ID" "/DProductIconFile=$productIconPath" $fixturePath
        if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup rejected the catalog-derived installer identity or icon"
        }
      shell: pwsh
    timeout-minutes: 15
  comfy_backend_validation:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
        - platform: linux
          runner: ubuntu-22.04
        - platform: macos
          runner: macos-15
        - platform: windows
          runner: windows-2022
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::enable_windows_long_paths
      if: matrix.platform == 'windows'
      run: git config --global core.longpaths true
      shell: pwsh
    - name: steps::setup_cargo_config
      if: matrix.platform == 'linux'
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_cargo_config
      if: matrix.platform == 'macos'
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_cargo_config
      if: matrix.platform == 'windows'
      run: |
        New-Item -ItemType Directory -Path "./../.cargo" -Force
        Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
      shell: pwsh
    - name: run_tests::comfy_backend_validation
      if: matrix.platform == 'linux'
      run: cargo clippy --release --all-targets --all-features -p comfy_backend_corex -p comfy_backend_cuda -p comfy_backend_directml -p comfy_backend_metal -p comfy_backend_mlu -p comfy_backend_npu -p comfy_backend_rocm -p comfy_backend_xpu -- --deny warnings
    - name: run_tests::comfy_backend_validation
      if: matrix.platform == 'macos'
      run: cargo clippy --release --all-targets --all-features -p comfy_backend_metal -- --deny warnings
    - name: run_tests::comfy_backend_validation
      if: matrix.platform == 'windows'
      run: cargo clippy --release --all-targets --all-features -p comfy_backend_cuda -p comfy_backend_directml -- --deny warnings
      shell: pwsh
    - name: steps::cleanup_cargo_config
      if: always() && matrix.platform == 'linux'
      run: |
        rm -rf ./../.cargo
    - name: steps::cleanup_cargo_config
      if: always() && matrix.platform == 'macos'
      run: |
        rm -rf ./../.cargo
    - name: steps::cleanup_cargo_config
      if: always() && matrix.platform == 'windows'
      run: |
        Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
      shell: pwsh
    timeout-minutes: 60
  product_smoke:
    needs:
    - shared_validation
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    strategy:
      matrix:
        include:
        - product: rust
          application_features: agentic-tools,rust-tools
          remote_features: rust-tools
      fail-fast: false
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: run_tests::product_smoke
      run: cargo xtask bundle --product "$PRODUCT_ID" --platform linux --target x86_64-unknown-linux-gnu --dry-run
      env:
        PRODUCT_ID: ${{ matrix.product }}
    - name: run_tests::product_smoke
      run: cargo check --release --package zed --no-default-features --features "$APPLICATION_FEATURES"
      env:
        ZED_PRODUCT_ID: ${{ matrix.product }}
        APPLICATION_FEATURES: ${{ matrix.application_features }}
    - name: run_tests::product_smoke
      run: cargo check --release --package remote_server --no-default-features --features "$REMOTE_FEATURES"
      env:
        ZED_PRODUCT_ID: ${{ matrix.product }}
        REMOTE_FEATURES: ${{ matrix.remote_features }}
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 45
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
