[package]
name = "sim_credentials_provider"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
multiplayer-tools = [
    "dep:bech32",
    "dep:collaboration_domain",
    "dep:getrandom",
    "dep:hex",
    "dep:nostr",
    "dep:secp256k1",
    "dep:serde",
    "dep:sha2",
    "dep:thiserror",
    "dep:uuid",
    "dep:zeroize",
]

[lib]
path = "src/sim_credentials_provider.rs"

[dependencies]
anyhow.workspace = true
bech32 = { workspace = true, optional = true }
collaboration_domain = { workspace = true, optional = true }
credentials_provider.workspace = true
futures.workspace = true
getrandom = { workspace = true, optional = true }
gpui.workspace = true
hex = { workspace = true, optional = true }
nostr = { workspace = true, optional = true }
paths.workspace = true
release_channel.workspace = true
secp256k1 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
