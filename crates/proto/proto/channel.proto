syntax = "proto3";
package sim.messages;

import "buffer.proto";
import "core.proto";

message Channel {
  uint64 id = 1;
  string name = 2;
  ChannelVisibility visibility = 3;
  int32 channel_order = 4;
  repeated uint64 parent_path = 5;
}

enum ChannelVisibility {
  Public = 0;
  Members = 1;
}

message UpdateChannels {
  repeated Channel channels = 1;
  repeated uint64 delete_channels = 4;
  repeated Channel channel_invitations = 5;
  repeated uint64 remove_channel_invitations = 6;
  repeated ChannelParticipants channel_participants = 7;
  repeated ChannelBufferVersion latest_channel_buffer_versions = 9;
  repeated PendingRequestCount pending_request_counts = 16;

  reserved 8;
  reserved 10 to 15;
}

message PendingRequestCount {
  uint64 channel_id = 1;
  uint32 count = 2;
}

message UpdateUserChannels {
  repeated ChannelBufferVersion observed_channel_buffer_version = 2;
  repeated ChannelMembership channel_memberships = 3;

  reserved 1;
}

message ChannelMembership {
  uint64 channel_id = 1;
  ChannelRole role = 2;
}

message ChannelMessageId {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message ChannelPermission {
  uint64 channel_id = 1;
  ChannelRole role = 3;
}

message ChannelParticipants {
  uint64 channel_id = 1;
  repeated uint64 participant_user_ids = 2;
}

message JoinChannel {
  uint64 channel_id = 1;
}

message DeleteChannel {
  uint64 channel_id = 1;
}

message GetChannelMembers {
  uint64 channel_id = 1;
  string query = 2;
  uint64 limit = 3;
}

message GetChannelMembersResponse {
  repeated ChannelMember members = 1;
  repeated User users = 2;
}

message RequestJoinChannel {
  uint64 channel_id = 1;
  optional string reason = 2;
}

message RequestJoinChannelResponse {
  bool success = 1;
}

message RespondToJoinRequest {
  uint64 channel_id = 1;
  uint64 requesting_user_id = 2;
  bool approve = 3;
  optional string denial_reason = 4;
}

message RespondToJoinRequestResponse {
  bool success = 1;
}

message GetPendingJoinRequests {
  uint64 channel_id = 1;
}

message GetPendingJoinRequestsResponse {
  repeated PendingJoinRequest requests = 1;
}

message PendingJoinRequest {
  uint64 user_id = 1;
  optional string reason = 2;
  uint64 created_at = 3;
}

message JoinRequestAdded {
  uint64 channel_id = 1;
  uint64 requesting_user_id = 2;
  optional string reason = 3;
  uint64 created_at = 4;
}

message JoinRequestResponded {
  uint64 channel_id = 1;
  bool approved = 2;
  optional string denial_reason = 3;
}

message ChannelMember {
  uint64 user_id = 1;
  Kind kind = 3;
  ChannelRole role = 4;

  enum Kind {
    Member = 0;
    Invitee = 1;
  }
}

message SubscribeToChannels {}

message CreateChannel {
  string name = 1;
  optional uint64 parent_id = 2;
}

message CreateChannelResponse {
  Channel channel = 1;
  optional uint64 parent_id = 2;
}

message InviteChannelMember {
  uint64 channel_id = 1;
  uint64 user_id = 2;
  ChannelRole role = 4;
}

message RemoveChannelMember {
  uint64 channel_id = 1;
  uint64 user_id = 2;
}

enum ChannelRole {
  Admin = 0;
  Member = 1;
  Guest = 2;
  Banned = 3;
  Talker = 4;
}

message SetChannelMemberRole {
  uint64 channel_id = 1;
  uint64 user_id = 2;
  ChannelRole role = 3;
}

message SetChannelVisibility {
  uint64 channel_id = 1;
  ChannelVisibility visibility = 2;
}

message RenameChannel {
  uint64 channel_id = 1;
  string name = 2;
}

message RenameChannelResponse {
  Channel channel = 1;
}

message JoinChannelChat {
  uint64 channel_id = 1;
}

message JoinChannelChatResponse {
  repeated ChannelMessage messages = 1;
  bool done = 2;
}

message LeaveChannelChat {
  uint64 channel_id = 1;
}

message SendChannelMessage {
  uint64 channel_id = 1;
  string body = 2;
  Nonce nonce = 3;
  repeated ChatMention mentions = 4;
  optional uint64 reply_to_message_id = 5;
  repeated string file_ids = 6;
  optional ChannelMessagePriority priority = 7;
}

enum ChannelMessagePriority {
  ChannelMessagePriorityNormal = 0;
  ChannelMessagePriorityImportant = 1;
  ChannelMessagePriorityUrgent = 2;
}

message RemoveChannelMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message UpdateChannelMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  Nonce nonce = 4;
  string body = 5;
  repeated ChatMention mentions = 6;
}

message AckChannelMessage {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message AckChannelThread {
  uint64 channel_id = 1;
  uint64 root_message_id = 2;
  uint64 message_id = 3;
}

message SendChannelMessageResponse {
  ChannelMessage message = 1;
}

message FileAttachment {
  string id = 1;
  string filename = 2;
  uint64 file_size = 3;
  string mime_type = 4;
  string url = 5;
  uint64 uploader_id = 6;
  uint64 uploaded_at = 7;
  optional uint64 image_width = 8;
  optional uint64 image_height = 9;
  optional uint64 duration_ms = 10;
  optional string thumbnail_url = 11;
  uint64 download_count = 12;
}

message GetFileUploadUrl {
  uint64 channel_id = 1;
  string filename = 2;
  uint64 file_size = 3;
  string mime_type = 4;
}

message GetFileUploadUrlResponse {
  string url = 1;
  string file_id = 2;
  map<string, string> headers = 3;
}

message ConfirmFileUpload {
  string file_id = 1;
}

message ConfirmFileUploadResponse {
  FileAttachment attachment = 1;
}

message GetFileDownloadUrl {
  string file_id = 1;
}

message GetFileDownloadUrlResponse {
  string url = 1;
  uint64 download_count = 2;
}

message ChannelMessageSent {
  uint64 channel_id = 1;
  ChannelMessage message = 2;
}

message ChannelMessageUpdate {
  uint64 channel_id = 1;
  ChannelMessage message = 2;
}

message AddReaction {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  string emoji_name = 3;
}

message RemoveReaction {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  string emoji_name = 3;
}

message UpdateMessageReactions {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  repeated ReactionSummary reactions = 3;
}

message UpdateMessageReactionsResponse {
  repeated ReactionSummary reactions = 1;
}

message GetChannelMessages {
  uint64 channel_id = 1;
  uint64 before_message_id = 2;
}

message GetChannelMessagesResponse {
  repeated ChannelMessage messages = 1;
  bool done = 2;
}

message GetChannelMessagesById {
  repeated uint64 message_ids = 1;
}

message SearchChannelMessages {
  uint64 channel_id = 1;
  string query = 2;
  optional uint64 before_message_id = 3;
  uint32 limit = 4;
  optional string filter_channel = 5;
  optional string filter_user = 6;
  optional uint64 filter_after = 7;
  optional uint64 filter_before = 8;
}

message SearchChannelMessagesResponse {
  repeated SearchResult results = 1;
  bool done = 2;
}

message SearchResult {
  ChannelMessage message = 1;
  string channel_name = 2;
  string sender_name = 3;
  repeated uint64 match_positions = 4;
  uint64 channel_id = 5;
}

message ScheduleChannelMessage {
  uint64 channel_id = 1;
  string body = 2;
  uint64 scheduled_at = 3;
  Nonce nonce = 4;
  repeated ChatMention mentions = 5;
}

message ScheduleChannelMessageResponse {
  uint64 scheduled_message_id = 1;
}

message CancelScheduledMessage {
  uint64 scheduled_message_id = 1;
  uint64 channel_id = 2;
}

message UpdateScheduledMessage {
  uint64 scheduled_message_id = 1;
  uint64 channel_id = 2;
  optional string body = 3;
  optional uint64 scheduled_at = 4;
  repeated ChatMention mentions = 5;
}

message GetScheduledMessages {
  uint64 channel_id = 1;
}

message GetScheduledMessagesResponse {
  repeated ScheduledMessage messages = 1;
}

message ScheduledMessage {
  uint64 id = 1;
  uint64 channel_id = 2;
  string body = 3;
  uint64 sender_id = 4;
  uint64 scheduled_at = 5;
  uint64 created_at = 6;
  Nonce nonce = 7;
  repeated ChatMention mentions = 8;
}

message ScheduledMessageSent {
  uint64 channel_id = 1;
  ChannelMessage message = 2;
}

message ScheduledMessageFailed {
  uint64 scheduled_message_id = 1;
  uint64 channel_id = 2;
  string reason = 3;
}

message Bookmark {
  uint64 id = 1;
  uint64 channel_id = 2;
  string label = 3;
  string url = 4;
  optional string file_id = 5;
  optional uint64 message_id = 6;
  BookmarkType type = 7;
  uint64 created_by = 8;
  uint64 created_at = 9;
  optional string description = 10;
  uint32 sort_order = 11;
}

enum BookmarkType {
  BookmarkLink = 0;
  BookmarkFile = 1;
  BookmarkMessage = 2;
}

message AddBookmark {
  uint64 channel_id = 1;
  string label = 2;
  BookmarkType type = 3;
  string url = 4;
  optional string file_id = 5;
  optional uint64 message_id = 6;
  optional string description = 7;
}

message RemoveBookmark {
  uint64 channel_id = 1;
  uint64 bookmark_id = 2;
}

message UpdateBookmark {
  uint64 channel_id = 1;
  uint64 bookmark_id = 2;
  string label = 3;
  optional string description = 4;
}

message ReorderBookmarks {
  uint64 channel_id = 1;
  repeated uint64 bookmark_ids = 2;
}

message GetBookmarks {
  uint64 channel_id = 1;
}

message GetBookmarksResponse {
  repeated Bookmark bookmarks = 1;
}

message UpdateChannelBookmarks {
  uint64 channel_id = 1;
  repeated Bookmark bookmarks = 2;
  repeated uint64 removed_bookmark_ids = 3;
}

message GetThread {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  uint64 before_message_id = 3;
  uint32 limit = 4;
}

message GetThreadResponse {
  ChannelMessage root_message = 1;
  repeated ChannelMessage replies = 2;
  bool done = 3;
}

message GetThreads {
  uint64 channel_id = 1;
}

message GetThreadsResponse {
  repeated ThreadSummary threads = 1;
}

message ThreadSummary {
  uint64 root_message_id = 1;
  uint32 reply_count = 2;
  uint64 latest_reply_at = 3;
  repeated uint64 participant_user_ids = 4;
  bool has_unread = 5;
}

message MoveChannel {
  uint64 channel_id = 1;
  uint64 to = 2;
}

message ReorderChannel {
  uint64 channel_id = 1;
  enum Direction {
    Up = 0;
    Down = 1;
  }
  Direction direction = 2;
}

message JoinChannelBuffer {
  uint64 channel_id = 1;
}

message ChannelBufferVersion {
  uint64 channel_id = 1;
  repeated VectorClockEntry version = 2;
  uint64 epoch = 3;
}

message UpdateChannelBufferCollaborators {
  uint64 channel_id = 1;
  repeated Collaborator collaborators = 2;
}

message UpdateChannelBuffer {
  uint64 channel_id = 1;
  repeated Operation operations = 2;
}

message ChannelMessage {
  uint64 id = 1;
  string body = 2;
  uint64 timestamp = 3;
  uint64 sender_id = 4;
  Nonce nonce = 5;
  repeated ChatMention mentions = 6;
  optional uint64 reply_to_message_id = 7;
  optional uint64 edited_at = 8;
  repeated ReactionSummary reaction_summaries = 9;
  optional uint64 scheduled_at = 10;
  repeated FileAttachment files = 11;
  ChannelMessagePriority priority = 12;
}

message UrgentMessageNotification {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  uint64 sender_id = 3;
  string message_preview = 4;
}

message UserGroup {
  uint64 id = 1;
  string name = 2;
  string display_name = 3;
  uint64 admin_id = 4;
  repeated uint64 member_ids = 5;
}

message CreateGroup {
  string name = 1;
  string display_name = 2;
  repeated uint64 member_ids = 3;
}

message CreateGroupResponse {
  UserGroup group = 1;
}

message UpdateGroup {
  uint64 group_id = 1;
  optional string name = 2;
  optional string display_name = 3;
}

message UpdateGroupResponse {
  UserGroup group = 1;
}

message DeleteGroup {
  uint64 group_id = 1;
}

message DeleteGroupResponse {}

message GetGroups {}

message GetGroupsResponse {
  repeated UserGroup groups = 1;
}

message UpdateGroupMembers {
  uint64 group_id = 1;
  repeated uint64 add_user_ids = 2;
  repeated uint64 remove_user_ids = 3;
}

message UpdateGroupMembersResponse {
  UserGroup group = 1;
}

message LeaveGroup {
  uint64 group_id = 1;
}

message LeaveGroupResponse {}

message UpdateGroups {
  repeated UserGroup groups = 1;
  repeated uint64 delete_group_ids = 2;
}

message ChatMention {
  Range range = 1;
  uint64 user_id = 2;
  uint64 group_id = 3;
}

message Reaction {
  string emoji_name = 1;
  repeated uint64 user_ids = 2;
}

message ReactionSummary {
  string emoji_name = 1;
  uint32 count = 2;
  repeated uint64 user_ids = 3;
}

message RejoinChannelBuffers {
  repeated ChannelBufferVersion buffers = 1;
}

message RejoinChannelBuffersResponse {
  repeated RejoinedChannelBuffer buffers = 1;
}

message AckBufferOperation {
  uint64 buffer_id = 1;
  uint64 epoch = 2;
  repeated VectorClockEntry version = 3;
}

message JoinChannelBufferResponse {
  uint64 buffer_id = 1;
  uint32 replica_id = 2;
  string base_text = 3;
  repeated Operation operations = 4;
  repeated Collaborator collaborators = 5;
  uint64 epoch = 6;
}

message RejoinedChannelBuffer {
  uint64 channel_id = 1;
  repeated VectorClockEntry version = 2;
  repeated Operation operations = 3;
  repeated Collaborator collaborators = 4;
}

message LeaveChannelBuffer {
  uint64 channel_id = 1;
}

message RespondToChannelInvite {
  uint64 channel_id = 1;
  bool accept = 2;
}
