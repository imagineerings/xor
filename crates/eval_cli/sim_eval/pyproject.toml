[project]
name = "sim-eval"
version = "0.2.0"
description = "Harbor agent wrapper and remote orchestration CLI for Sim's eval-cli"
requires-python = ">=3.12"
dependencies = ["harbor==0.15.0", "modal==1.5.0"]

[project.scripts]
sim-eval = "sim_eval.cli:main"

[tool.setuptools]
packages = ["sim_eval"]
package-dir = { sim_eval = "." }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
