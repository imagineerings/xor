[package]
name = "comfy_ui"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
[lints]
workspace = true
[lib]
path = "src/comfy_ui.rs"

[[test]]
name = "native_diffusion_interaction"
path = "tests/native_diffusion_interaction.rs"
required-features = ["test-support"]

[features]
test-support = [
    "comfy_runtime/test-support",
    "db/test-support",
    "gpui/test-support",
    "project/test-support",
    "workspace/test-support",
]
[dependencies]
anyhow.workspace = true
base64.workspace = true
comfy_runtime.workspace = true
comfy_tensor.workspace = true
comfy_types.workspace = true
db.workspace = true
editor.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
menu.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sha2.workspace = true
smol.workspace = true
thiserror.workspace = true
ui.workspace = true
uuid.workspace = true
workspace.workspace = true
[dev-dependencies]
comfy_runtime = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
theme.workspace = true
theme_settings.workspace = true
