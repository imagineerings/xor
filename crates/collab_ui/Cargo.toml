[package]
name = "collab_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/collab_ui.rs"
doctest = false

[features]
default = []
multiplayer-tools = [
    "dep:agent_ui",
    "dep:audio",
    "dep:chrono",
    "dep:collaboration_domain",
    "dep:git_ui",
    "dep:nostr_compat",
    "dep:qrcode",
    "dep:remote",
    "dep:zeroize",
    "agent_ui/multiplayer-tools",
    "git_ui/multiplayer-tools",
]
test-support = [
    "call/test-support",
    "client/test-support",
    "collections/test-support",
    "editor/test-support",
    "gpui/test-support",
    "project/test-support",
    "settings/test-support",
    "util/test-support",
    "workspace/test-support",

    "title_bar/test-support",
]

[dependencies]
agent_ui = { workspace = true, optional = true }
anyhow.workspace = true
audio = { workspace = true, optional = true }
call.workspace = true
channel.workspace = true
chrono = { workspace = true, optional = true }
collaboration_domain = { workspace = true, optional = true }
client.workspace = true
collections.workspace = true
db.workspace = true
editor.workspace = true
futures.workspace = true
fuzzy.workspace = true
gpui.workspace = true
git_ui = { workspace = true, optional = true }
livekit_client.workspace = true
menu.workspace = true
nostr_compat = { workspace = true, optional = true }
notifications.workspace = true
picker.workspace = true
project.workspace = true
qrcode = { workspace = true, optional = true }
remote = { workspace = true, optional = true }
release_channel.workspace = true
rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
smallvec.workspace = true
smol.workspace = true
telemetry.workspace = true
theme.workspace = true
theme_settings.workspace = true
thiserror.workspace = true
time.workspace = true
title_bar.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
call = { workspace = true, features = ["test-support"] }
client = { workspace = true, features = ["test-support"] }
collab.workspace = true
collections = { workspace = true, features = ["test-support"] }
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
iroh-base.workspace = true
notifications = { workspace = true, features = ["test-support"] }

project = { workspace = true, features = ["test-support"] }
rpc = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
title_bar = { workspace = true, features = ["test-support"] }

util = { workspace = true, features = ["test-support"] }
uuid.workspace = true

workspace = { workspace = true, features = ["test-support"] }
